<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINHA LOJA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header style="background-color: #000000; color: #ffffff; text-align: center; padding: 30px 15px; margin-bottom: 25px;">
  <h1 style="color: #ffffff; font-size: 48px; font-weight: 900; letter-spacing: 8px; margin: 0;">ROYSS</h1>
  <p style="color: #cccccc; font-size: 11px; letter-spacing: 4px; margin: 10px 0 0;">STREETWEAR • PORTUGAL</p>
</header>


<header>
    <h1>MINHA LOJA</h1>
    <p>ROUPA PERSONALIZADA</p>
</header>

<section class="apresentacao">
    <p>UMA PEÇA. O TEU ESTILO.</p>
    <h2>Conhece a tua próxima T-shirt favorita.</h2>
</section>

<main class="produtos">

    <div class="produto">

        <div class="fotografias">
            <div>
                <img src="IMG_2936.jpeg" alt="Frente da T-shirt">
                <p>FRENTE</p>
            </div>

            <div>
                <img src="IMG_2937.jpeg" alt="Costas da T-shirt">
                <p>COSTAS</p>
            </div>
        </div>

        <h2>T-shirt personalizada</h2>
        <p>Um estilo único, feito para ti.</p>
        <p class="preco">29,99 €</p>

        <label for="nome">O teu nome</label>
        <input id="nome" type="text" placeholder="Escreve o teu nome">

        <label for="tamanho">Escolhe o tamanho</label>
        <select id="tamanho">
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M" selected>M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
        </select>

        <label for="quantidade">Quantidade</label>
        <input id="quantidade" type="number" min="1" max="10" value="1">

        <button onclick="encomendar()">ENCOMENDAR</button>

    </div>

</main>

<footer>
    <p>Obrigado por visitares a nossa loja.</p>
</footer>

<script>
function encomendar() {
    const nome = document.getElementById('nome').value.trim();
    const tamanho = document.getElementById('tamanho').value;
    const quantidade = Number(document.getElementById('quantidade').value);

    if (!nome) {
        alert('Escreve o teu nome antes de encomendar.');
        return;
    }

    if (!Number.isInteger(quantidade) || quantidade < 1 || quantidade > 10) {
        alert('Escolhe uma quantidade entre 1 e 10.');
        return;
    }

    const total = (29.99 * quantidade).toFixed(2).replace('.', ',');
    const assunto = encodeURIComponent('Encomenda de T-shirt');
    const mensagem = encodeURIComponent(
        'Olá! Quero encomendar:\n\n' +
        'Nome: ' + nome + '\n' +
        'Produto: T-shirt personalizada\n' +
        'Tamanho: ' + tamanho + '\n' +
        'Quantidade: ' + quantidade + '\n' +
        'Preço estimado: ' + total + ' €\n\n' +
        'Aguardo confirmação.'
    );

    window.location.href =
        'mailto:reixrodrigo@gmail.com?subject=' +
        assunto + '&body=' + mensagem;
}
</script>

</body>
</html>
